# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Command Injection (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask image resizer that pastes the chosen size into an ImageMagick shell command (OS command injection). The SKF lab folder python/CMD is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (build/web/Dockerfile) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-cmd

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.139.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build:
        context: app
        dockerfile: app/Dockerfile.lab

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the resize form posts a size to /home
    script: checks/form.sh

message: |
  OWASP SKF Command Injection answers at {{ machines.web.ports.web.url }}.
  The size you pick is passed to a shell command that resizes the image.
